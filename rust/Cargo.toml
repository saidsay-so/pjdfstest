[package]
name = "pjdfstest"
description = "A generic POSIX file system test suite."
authors = ["Sayafdine Said <sayafdine.said@outlook.fr>", "Alan Somers <asomers@gmail.com>"]
documentation = "https://saidsay-so.github.io/pjdfstest/"
repository = "https://github.com/saidsay-so/pjdfstest"
categories = ["filesystem", "development-tools::testing"]
rust-version = "1.74.0"
keywords = ["filesystem", "test"]
version = "0.2.2"
edition = "2021"
license = "BSD-2-Clause"

[dependencies]
colored = ">=2.2.0,<4"
exacl = "0.13.0"
tempfile = "3.14.0"
rand = { version = "0.10.2" }
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
anyhow = "1.0.93"
libc = "0.2.162"
pastey = "0.2.2"
clap = { version = "4.5.23", features = ["derive", "wrap_help"] }
nix = { version = "0.29", features = ["fs", "socket", "mount", "user"] }
serde = { version = "1.0.214", features = ["derive"] }
inventory = "0.3.0"
walkdir = "2.3.2"
sysctl = "0.7.1"
toml = { version = "1.1.2", default-features = false, features = ["parse", "serde"] }

[target.'cfg(target_os = "freebsd")'.dependencies]
jail = ">=0.2.0,<0.4.0"

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5.4"

[[bin]]
name = "pjdfstest"
path = "src/main.rs"

[build-dependencies]
cfg_aliases = "0.2.1"
